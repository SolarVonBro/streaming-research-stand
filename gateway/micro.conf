# Вариант «микросервисы»: nginx как API-шлюз маршрутизирует запросы в четыре сервиса.
# Сервис delivery проверяет токен отдельным HTTP-вызовом сервиса auth.
worker_processes 1;
events { worker_connections 4096; }
http {
  access_log off;
  keepalive_timeout 65;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_max_temp_file_size 0;

  upstream auth      { server auth:8000;      keepalive 32; }
  upstream catalog   { server catalog:8000;   keepalive 32; }
  upstream delivery  { server delivery:8000;  keepalive 64; }
  upstream telemetry { server telemetry:8000; keepalive 32; }

  server {
    listen 8080;
    location = /nginx_status { stub_status; }
    location /api/v1/sessions { proxy_pass http://auth; }
    location /api/v1/videos   { proxy_pass http://catalog; }
    location /api/v1/events   { proxy_pass http://telemetry; }
    location /media/          { proxy_pass http://delivery; }
    location = /healthz       { proxy_pass http://delivery; }
    location /internal/       { return 404; }  # внутренние вызовы снаружи недоступны
  }
}
