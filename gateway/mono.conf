# Вариант «модульный монолит»: nginx на входе -> один процесс приложения.
# Конфигурация nginx одинакова для обоих вариантов, различаются только upstream.
worker_processes 2;   # шлюз не должен быть узким местом ни в одном варианте
events { worker_connections 4096; }
http {
  access_log off;
  keepalive_timeout 65;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_max_temp_file_size 0;   # не писать большие ответы во временные файлы

  upstream app { server app:8000; keepalive 64; }

  server {
    listen 8080;
    location = /nginx_status { stub_status; }
    location /internal/ { return 404; }  # как и в микросервисном варианте
    location / { proxy_pass http://app; }
  }
}
