[project]
name = "stand-tools"
version = "1.0.0"
description = "Раннер, анализ и тесты экспериментального стенда (выполняются на хосте)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".devtools", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "players"]
