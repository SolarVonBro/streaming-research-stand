# Полный эксперимент на раннере GitHub Actions (4 vCPU / 16 ГБ). Запуск вручную:
# Actions -> experiment -> Run workflow. Каждый блок идёт на отдельной машине, но все
# сравнения внутри блока (и его A/A-тест) — на одной машине.
name: experiment

on:
  workflow_dispatch:
    inputs:
      which:
        description: "Что запускать"
        type: choice
        options: [all, e1, e2, e3, pilot, calibration]
        default: all

permissions:
  contents: read

jobs:
  pilot:
    if: inputs.which == 'pilot'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with: { version: "0.5.11" }
      - run: make pilot
      - run: make analyze && cat results/processed/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with: { name: raw-pilot, path: results/raw/, retention-days: 90 }

  calibration:
    if: inputs.which == 'calibration'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with: { version: "0.5.11" }
      - run: make experiment CONFIGS="configs/calibration-e1.yaml"
      - run: make analyze && cat results/processed/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with: { name: raw-calibration, path: results/raw/, retention-days: 90 }

  e1:
    if: inputs.which == 'all' || inputs.which == 'e1'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with: { version: "0.5.11" }
      - run: make smoke
      - run: make experiment CONFIGS="configs/aa-e1.yaml configs/calibration-e1.yaml configs/e1-architecture.yaml"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with: { name: raw-e1, path: results/raw/, retention-days: 90 }

  e2:
    if: inputs.which == 'all' || inputs.which == 'e2'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with: { version: "0.5.11" }
      - run: make smoke
      - run: make experiment CONFIGS="configs/aa-e2.yaml configs/e2-abr.yaml"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with: { name: raw-e2, path: results/raw/, retention-days: 90 }

  e3:
    if: inputs.which == 'all' || inputs.which == 'e3'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with: { version: "0.5.11" }
      - run: make smoke
      - run: make experiment CONFIGS="configs/e3-joint.yaml"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with: { name: raw-e3, path: results/raw/, retention-days: 90 }

  analyze:
    needs: [e1, e2, e3]
    if: always() && inputs.which != 'pilot' && inputs.which != 'calibration'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with: { version: "0.5.11" }
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with: { pattern: raw-*, path: results/raw, merge-multiple: true }
      - name: Анализ и архив сырых данных с контрольной суммой
        run: |
          make analyze
          cat results/processed/summary.md >> "$GITHUB_STEP_SUMMARY"
          tar -czf raw-data.tar.gz -C results raw && sha256sum raw-data.tar.gz | tee raw-data.tar.gz.sha256
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: analysis
          path: |
            results/processed/
            results/figures/
            raw-data.tar.gz
            raw-data.tar.gz.sha256
          retention-days: 90
