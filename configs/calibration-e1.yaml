# Калибровка на известном результате: в выдачу сегмента вносится задержка 0 или 20 мс.
# Стенд обязан показать рост медианы задержки сегмента на ~20 мс; при 20 зрителях нет очередей,
# поэтому там прирост должен совпасть с фактической задержкой, при 300 — показывает взаимодействие с очередью.
name: calibration-e1
kind: load
seed: 20261120
factors:
  arch: [mono]
  users: [20, 300]          # 20 — без очередей (проверка точности), 300 — рабочая нагрузка
  inject_delay_ms: [0, 20]
repetitions: 5
warmup_seconds: 15
duration_seconds: 40
randomize_order: true
recreate_sut: true
monitoring: true           # нужна гистограмма фактической задержки
load: {level: 1, pacing_seconds: 4.0}
